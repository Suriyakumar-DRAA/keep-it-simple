<header class="bg-white border-bottom py-2 px-3 d-flex align-items-center justify-content-betweenflex-shrink-0 w-100 gap-3">

    <!-- Left: Logo & Menu -->
    <div class="d-flex align-items-center gap-3">
        <div class="bg-primary rounded d-flex align-items-center justify-content-center text-white fw-bold small"
            style="width: 36px; height: 36px;">DrA</div>
    </div>

    <!-- Center: Global Search -->
    <div class="d-flex justify-content-center flex-grow-1">
               <div class="d-flex align-items-center bg-light rounded border px-2 py-1">
            <button class="btn btn-sm btn-link text-dark p-0 text-decoration-none">
                <i class="bi bi-chevron-left small"></i>
            </button>
            <span class="fw-medium mx-3 small text-nowrap">Today - {{ currentDate }}</span>
            <button class="btn btn-sm btn-link text-dark p-0 text-decoration-none">
                <i class="bi bi-chevron-right small"></i>
            </button>
        </div>

    </div>

    <!-- Right: User Role & Actions -->
    <div class="d-flex align-items-center gap-2">
        <div class="d-flex gap-2 w-50" style="">
            <!-- <select class="form-select form-select-sm w-auto bg-light border-0">
                <option>Search by</option>
                <option>Name</option>
                <option>ID</option>
            </select> -->
            <div class="position-relative flex-grow-1">
                <input type="text" class="form-control form-control-sm bg-light border-0 pe-4"
                    placeholder="Global Search...">
                <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-2 text-secondary small"></i>
            </div>
        </div>
        <!-- Role Display (Fixed) -->
        <div
            class="d-flex align-items-center gap-2 px-3 py-1 bg-primary-subtle rounded border border-primary-subtle text-primary">
            <i class="bi bi-person-badge-fill small"></i>
            <span class="small fw-bold text-uppercase">{{ userRole }}</span>
        </div>
        <!-- Role Switcher -->
        <div class="dropdown">
            <button class="btn btn-light btn-sm rounded-circle" type="button" (click)="toggleRoleMenu($event)">
                <i class="bi bi-person"></i>
            </button>

            <ul class="dropdown-menu end-0 show shadow-sm" *ngIf="showRoleMenu"
                style="display: block; position: absolute; right: 0; top: 100%; z-index: 1050; min-width: 200px;">
                <li>
                    <h6 class="dropdown-header">Switch Role</h6>
                </li>

                <!-- Optometrist Option -->
                <li>
                    <button class="dropdown-item d-flex justify-content-between align-items-center py-2"
                        [class.active-role]="userRole === 'optometrist'" (click)="selectRole('optometrist')">
                        <span>Optometrist</span>
                        <i *ngIf="userRole === 'optometrist'" class="bi bi-check-lg text-primary"></i>
                    </button>
                </li>

                <!-- Ophthalmologist Option -->
                <li>
                    <button class="dropdown-item d-flex justify-content-between align-items-center py-2"
                        [class.active-role]="userRole === 'ophthalmologist'" (click)="selectRole('ophthalmologist')">
                        <span>Ophthalmologist</span>
                        <i *ngIf="userRole === 'ophthalmologist'" class="bi bi-check-lg text-primary"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</header>
