<div class="d-flex flex-column align-items-center py-3 h-100 bg-white border-end" style="width: 80px;">
  <!-- Menu -->
  <div class="mb-4">
    <button class="btn btn-link p-0">
      <img src="assets/images/menu.svg" alt="Menu" width="32" height="32">
    </button>
  </div>

  <!-- Logo/Brand -->
  <div class="mb-5 text-center">
    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mb-1" style="width: 32px; height: 32px;">
       <!-- Placeholder for brand logo if needed, looking at Figma '9Y4Z5Q' seems to be a logo image -->
       <span style="font-size: 8px;">EMR</span>
    </div>
  </div>

  <div class="mt-auto d-flex flex-column gap-3 align-items-center">
    <!-- Notifications -->
    <button class="btn btn-link p-0 position-relative">
       <img src="assets/images/notification.svg" alt="Notifications" width="32" height="32">
       <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width: 10px; height: 10px;"></span>
    </button>

    <!-- Help -->
    <button class="btn btn-link p-0">
      <img src="assets/images/help.svg" alt="Help" width="32" height="32">
    </button>

    <!-- User Profile -->
    <button class="btn btn-link p-0 mb-3">
      <img src="assets/images/user-profile.svg" alt="User" width="36" height="36" class="rounded-circle border">
    </button>
  </div>
</div>
