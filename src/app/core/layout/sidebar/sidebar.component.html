<!-- Sidebar Container -->
<nav class="d-flex flex-column flex-shrink-0 bg-white h-100 shadow-sm sidebar-nav">

    <!-- Top Menu Items -->
    <ul class="nav flex-column mb-auto text-center w-100 p-0 m-0">

        @for (item of mainMenuItems; track item.id) {
        <li class="nav-item w-100">
            <a href="#" class="nav-link py-3 d-flex justify-content-center align-items-center"
                [class.active]="activeItem() === item.id" (click)="selectItem(item.id, $event)" [title]="item.label">
                <i class="bi" [class]="item.icon"></i>
            </a>
        </li>
        }

    </ul>

    <!-- Bottom Menu Items -->
    <div class="w-100 text-center pb-3">
        <a href="#" class="nav-link py-3 d-flex justify-content-center align-items-center text-muted bottom-icon"
            title="All Apps">
            <i class="bi bi-grid"></i>
        </a>
    </div>

</nav>
