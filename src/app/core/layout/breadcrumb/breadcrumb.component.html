<header class="align-items-center bg-white border-bottom d-flex justify-content-between mt-0 mx-0 px-3 rounded sub-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            @for (item of breadcrumbs; track item.label; let last = $last) {
                <li class="breadcrumb-item" [class.active]="last" [attr.aria-current]="last ? 'page' : null">
                    @if (!last && item.url) {
                        <a [routerLink]="item.url">
                            {{ item.label }}
                        </a>
                    } @else {
                        <span>{{ item.label }}</span>
                    }
                </li>
            }
        </ol>
    </nav>
</header>
