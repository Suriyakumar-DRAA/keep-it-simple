<div class="sub-header bg-white border-bottom py-2 px-3 d-flex align-items-center justify-content-between flex-shrink-0 position-relative">

    <!-- Left: OPD / IPD Buttons with Icons -->
    <div class="d-flex gap-2 z-1">
        <button class="btn btn-primary btn-sm fw-semibold d-flex align-items-center gap-2 px-3">
            <i class="bi bi-clipboard-pulse"></i> OPD
        </button>
        <button class="btn btn-light border btn-sm fw-semibold text-secondary d-flex align-items-center gap-2 px-3">
            <i class="bi bi-hospital"></i> IPD
        </button>
    </div>

    <!-- Center: Date Navigation (Absolutely Positioned) -->
    <div class="position-absolute start-50 top-50 translate-middle">
        <div class="d-flex align-items-center bg-light rounded border px-2 py-1">
            <button class="btn btn-sm btn-link text-dark p-0"><i class="bi bi-chevron-left small"></i></button>
            <span class="fw-medium mx-3 small text-nowrap">Today - {{ currentDate }}</span>
            <button class="btn btn-sm btn-link text-dark p-0"><i class="bi bi-chevron-right small"></i></button>
        </div>
    </div>

    <!-- Right Spacer to balance layout -->
    <div style="width: 140px;"></div>
</div>
