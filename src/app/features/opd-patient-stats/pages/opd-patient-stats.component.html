<div class="sidebar-container bg-light border-end d-flex flex-column h-100">
    <!-- Queue List with Scroll -->
    <div class="flex-grow-1 overflow-y-auto custom-scrollbar pt-2">
        <button *ngFor="let item of queueItems" (click)="selectQueue.emit(item.label)"
            class="queue-item btn border-0 text-start w-100 rounded-0 py-3 px-4 position-relative border-bottom"
            [class.bg-white]="selectedQueue === item.label" [class.active-queue]="selectedQueue === item.label">

            <!-- Active Indicator -->
            <div *ngIf="selectedQueue === item.label"
                class="active-indicator bg-primary position-absolute start-0 top-0 bottom-0"></div>

            <div class="h4 fw-bold mb-1" [class.text-primary]="selectedQueue === item.label"
                [class.text-secondary]="selectedQueue !== item.label">
                {{ item.count }}
            </div>

            <div class="small text-truncate" [class.text-primary]="selectedQueue === item.label"
                [class.fw-bold]="selectedQueue === item.label" [class.text-muted]="selectedQueue !== item.label">
                {{ item.label }}
            </div>
        </button>
    </div>
</div>
