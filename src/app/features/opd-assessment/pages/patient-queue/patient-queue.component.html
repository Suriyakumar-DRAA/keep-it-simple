<div class="queue-wrapper min-vh-100 d-flex position-relative bg-white border-end">
    <div class="queue-content d-flex flex-column overflow-hidden transition-all"
        [style.width]="visiblePatientQueue() ? '350px' : '0px'" [style.opacity]="visiblePatientQueue() ? '1' : '0'"
        [style.visibility]="visiblePatientQueue() ? 'visible' : 'hidden'">

        <div class="p-3 border-bottom bg-light">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 fw-bold m-0 text-dark text-truncate" title="{{ queueLabel }}">{{ queueLabel }}</h2>
                <div class="d-flex gap-1">
                    <small class="text-muted d-flex align-items-center me-2" style="font-size: 0.7rem;">Ctrl+B</small>
                    <button class="btn btn-sm btn-light border" (click)="onToggle()">
                        <i class="bi bi-chevron-left text-secondary"></i>
                    </button>
                </div>
            </div>

            <!-- Local Filter -->
            <div class="d-flex gap-2">
                <div class="position-relative flex-grow-1">
                    <input type="text" class="form-control form-control-sm pe-4" placeholder="Filter list...">
                    <i
                        class="bi bi-funnel position-absolute top-50 end-0 translate-middle-y me-2 text-secondary small"></i>
                </div>
            </div>
        </div>

        <div class="flex-grow-1 overflow-y-auto custom-scrollbar">
            <div *ngFor="let patient of patients" (click)="selectPatient.emit(patient.id)"
                class="patient-card p-3 border-bottom cursor-pointer position-relative"
                [class.bg-primary-subtle]="selectedPatientId === patient.id"
                [class.hover-bg-light]="selectedPatientId !== patient.id">

                <div *ngIf="selectedPatientId === patient.id"
                    class="position-absolute start-0 top-0 bottom-0 bg-primary" style="width: 4px;"></div>

                <div class="d-flex justify-content-between align-items-start mb-2 ps-2">
                    <div class="text-truncate pe-2">
                        <span class="fw-bold text-dark small">{{ patient.name }}</span>
                        <span class="text-muted small"> ({{ patient.gender }})</span>
                    </div>
                    <div class="d-flex gap-1 flex-shrink-0">
                        <span
                            class="badge bg-primary-subtle text-primary border border-primary-subtle d-flex align-items-center justify-content-center"
                            style="width: 20px; height: 20px;">E</span>
                        <span class="text-primary small fw-bold" style="font-size: 0.7rem;">OPTOM</span>
                    </div>
                </div>

                <div class="d-flex gap-1 mb-2 ps-2">
                    <span class="badge fw-medium px-2 py-1" [ngClass]="getStatusColor(patient.case.status)">{{
                        patient.case.status }}</span>
                    <span class="badge fw-medium px-2 py-1"
                        [ngClass]="getAppointmentTypeColor(patient?.case?.appointment_type)">{{
                        patient?.case?.appointment_type || 'Free' }}</span>
                </div>

                <div class="d-flex justify-content-end ps-2">
                    <span class="small text-secondary fw-medium">{{ getTimeDiff(patient?.case?.visit_date) }}</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Expand Button -->
    <button *ngIf="!visiblePatientQueue()" (click)="onToggle()"
        class="expand-btn btn btn-white border shadow-sm position-absolute start-0 top-50 translate-middle-y rounded-end d-flex align-items-center justify-content-center p-0"
        style="width: 24px; height: 60px; z-index: 10;" title="Expand Queue (Ctrl+B)">
        <i class="bi bi-chevron-right text-secondary small"></i>
    </button>
</div>
