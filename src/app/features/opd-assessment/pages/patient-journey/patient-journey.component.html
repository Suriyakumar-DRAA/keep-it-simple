<div class="px-3 py-3">
    <!-- Header: Title on Left, Controls on Right -->
    <div class="journey-header">
        <div class="header-left">
            <h1 class="journey-title">Patient journey</h1>
            <div class="total-time">
                <span class="total-time-label">TOTAL TIME</span> <strong> 01:23 min</strong>
            </div>
        </div>

        <!-- Send Patient Controls -->
        <div class="header-right">
            <div class="send-patient-controls">
                <select class="department-select">
                    <option>OPTOM</option>
                    <option>AR / NCT</option>
                    <option>OPHTHAL</option>
                    <option>RECEPTION</option>
                </select>
                <div class="search-wrapper">
                    <input type="text" class="search-input" placeholder="Search name here..">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z"
                            fill="#666" />
                    </svg>
                </div>
                <button class="send-button">Send</button>
            </div>
        </div>
    </div>

    <div class="journey-content mt-2 bg-light">
        <div class="journey-steps-wrapper">
            <div class="journey-steps">
                <!-- Reception (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img 
                            src="assets/images/patient-journey/reception.png" 
                            alt="Reception Icon" 
                            class="step-icon" 
                            style="width:40px; height:35px"
                        />
                    </div>
                    <div class="step-label">Reception</div>
                    <div class="step-time">12 min</div>
                </div>

                <!-- Waiting (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                      <img 
                            src="assets/images/patient-journey/waiting.png" 
                            alt="Waiting Icon" 
                            class="step-icon" 
                            style="width:40px; height:35px"
                        />
                    </div>
                    <div class="step-label">Waiting</div>
                    <div class="step-time">32 min</div>
                </div>

                <!-- AR / NCT (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img 
                            src="assets/images/patient-journey/ar_nct.png" 
                            alt="AR / NCT Icon" 
                            class="step-icon" 
                            style="width:40px; height:35px"
                        />
                    </div>
                    <div class="step-label">AR / NCT</div>
                    <div class="step-time">10 min</div>
                </div>

                <!-- Optom (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img 
                            src="assets/images/patient-journey/optom.png" 
                            alt="Optom Icon" 
                            class="step-icon" 
                            style="width:40px; height:35px"
                        />
                    </div>
                    <div class="step-label">Optom</div>
                    <div class="step-time">25 min</div>
                </div>

                <!-- Dilatation (Incomplete) -->
                <div class="step-item">
                    <div class="step-icon-wrapper completed">
                        <img 
                            src="assets/images/patient-journey/dilation.png" 
                            alt="Dilation Icon" 
                            class="step-icon" 
                            style="width:40px; height:35px"
                        />
                        <!-- Status Indicator - Incomplete/Dash -->
                        <div class="step-status-indicator incomplete">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 13H5v-2h14v2z" fill="white" />
                            </svg>
                        </div>
                    </div>
                    <div class="step-label">Dilatation</div>
                    <div class="step-time">08 min</div>
                </div>

                <!-- Ophthal -->
                <div class="step-item">
                    <div class="step-icon-wrapper current ophthal-icon-wrapper">
                       <img 
                            src="assets/images/patient-journey/ophthal.png"

                            class="step-icon" 
                            style="width:30px; height:28px"

                        <div class="step-status-indicator engage">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="4" fill="white" />
                            </svg>
                        </div>
                    </div>
                    <div class="step-label">Ophthal</div>
                    <div class="step-time">03 min</div>
