<div class="d-flex flex-grow-1 overflow-hidden">

    <!-- Stats Count -->
    <app-opd-patient-stats [selectedQueue]="selectedQueue" (selectQueue)="onQueueSelect($event)">
    </app-opd-patient-stats>

    <!-- Queue -->
    <app-patient-queue [patients]="patients" [selectedPatientId]="selectedPatientId"
        (selectPatient)="onSelectPatient($event)" [queueLabel]="selectedQueue">
    </app-patient-queue>

    <div class="flex-grow-1 d-flex flex-column overflow-hidden bg-white h-100">
        <ng-container *ngIf="patient; else noSelection">
            <app-patient-info [patient]="patient" [case]="patient.case" class="flex-shrink-0">
                <!-- Prevent shrinking -->
            </app-patient-info>
        </ng-container>

        <ng-template #noSelection>
            <div class="d-flex align-items-center justify-content-center h-100 text-muted">
                <div class="text-center">
                    <i class="bi bi-people display-1"></i>
                    <p class="mt-3">Select a patient from the queue to view details.</p>
                </div>
            </div>
        </ng-template>

        <div class="flex-grow-1 overflow-hidden">
            <div class="d-flex flex-column h-100">
                <!-- Tabs -->
                <div class="border-bottom bg-white">
                    <div class="d-flex gap-4 px-4 overflow-x-auto custom-scrollbar">
                        <ng-container>
                            <button *ngFor="let tab of tabs" (click)="setActiveTab(tab.id)"
                                class="btn border-0 rounded-0 py-3 small text-nowrap position-relative"
                                [class.text-dark]="activeTab === tab.id" [class.text-secondary]="activeTab !== tab.id">
                                {{ tab.label }}
                                <div *ngIf="activeTab === tab.id"
                                    class="position-absolute bottom-0 start-0 end-0 bg-dark" style="height: 3px;"></div>
                            </button>
                        </ng-container>
                    </div>
                </div>

                <!-- Tab Content Area -->
                <div class="flex-grow-1 bg-light p-4 overflow-auto custom-scrollbar">
                    <div class="card border-0 shadow-sm h-100 bg-white">
                        <ng-container [ngSwitch]="activeTab">
                            <app-history *ngSwitchCase="'history'"></app-history>
                            <app-auto-refraction *ngSwitchCase="'auto-refraction'"></app-auto-refraction>
                            <app-refraction *ngSwitchCase="'refraction'"></app-refraction>
                            <!-- <app-investigation *ngSwitchCase="'investigation'"></app-investigation>
                        <app-diagnosis *ngSwitchCase="'diagnosis'"></app-diagnosis>
                        <app-advice *ngSwitchCase="'advice'"></app-advice> -->

                            <!-- Fallback for other tabs not yet implemented as components -->
                            <div *ngSwitchDefault
                                class="p-5 text-center text-muted h-100 d-flex flex-column justify-content-center align-items-center">
                                <i class="bi bi-cone-striped display-4 mb-3 text-secondary opacity-50"></i>
                                <h5 class="text-dark">{{ activeTab | titlecase }} Content</h5>
                                <p class="small">Content for this tab is not yet implemented.</p>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
