<div class="split-layout">
    <div class="left-panel" [class.open]="isSidebarOpen"
        [style.width.%]="isSidebarOpen ? splitConfig.left : 0">
        <div class="left-panel-content">
            <app-patient-summary (close)="timelineCloseModal()"></app-patient-summary>
        </div>
    </div>

    <div class="d-flex flex-grow-1 overflow-hidden right-panel">
        <!-- Queue -->
        <app-patient-queue [patients]="patients" [selectedPatientId]="selectedPatientId"
            (selectPatient)="onSelectPatient($event)" [queueLabel]="selectedQueue" *ngIf="!isSidebarOpen">
        </app-patient-queue>

        <div class="flex-grow-1 d-flex flex-column overflow-hidden bg-white h-100">
            <ng-container *ngIf="patient; else noSelection">
                <app-patient-info [patient]="patient" [case]="patient.case" class="flex-shrink-0">
                    <!-- Prevent shrinking -->
                </app-patient-info>
            </ng-container>

            <ng-template #noSelection>
                <div class="d-flex align-items-center justify-content-center h-100 text-muted">
                    <div class="text-center">
                        <i class="bi bi-people display-1"></i>
                        <p class="mt-3">Select a patient from the queue to view details.</p>
                    </div>
                </div>
            </ng-template>

            <app-patient-journey> </app-patient-journey>

            <!-- Tabs Navigation -->
            <div class="px-3 py-3 main-workspace">
                <ul class="nav nav-tabs border-bottom-0">
                    @for (tab of tabs; track tab.id) {
                    <li class="nav-item">
                        <button class="nav-link" [class.active]="activeTabId === tab.id" (click)="activeTabId = tab.id">
                            {{ tab.label }}
                            @if (tab.completed) {
                            <i class="bi bi-check-circle-fill text-success ms-2" style="font-size: 0.8rem;"></i>
                            }
                        </button>
                    </li>
                    }
                </ul>
                <!-- Tab Content Area -->
                <div class="tab-content flex-grow-1 bg-light px-3 py-3">
                    <ng-container [ngSwitch]="activeTabId">
                        <app-overview *ngSwitchCase="'overview'"
                            (viewTimeline)="timelineOpenModal(splitTemplate, 'left')"></app-overview>
                        <app-examination *ngSwitchCase="'examination'"></app-examination>
                        <app-investigation *ngSwitchCase="'investigation'"></app-investigation>
                        <app-reports *ngSwitchCase="'reports'"></app-reports>
                        <div *ngSwitchDefault
                            class="p-5 text-center text-muted h-100 d-flex flex-column justify-content-center align-items-center">
                            <i class="bi bi-cone-striped display-4 mb-3 text-secondary opacity-50"></i>
                            <h5 class="text-dark">{{ activeTabId | titlecase }} Content</h5>
                            <p class="small">Content for this tab is not yet implemented.</p>
                        </div>
                    </ng-container>
                </div>
            </div>

            <ng-template #splitTemplate>
                <app-patient-summary (close)="timelineCloseModal()"></app-patient-summary>
            </ng-template>

        </div>
    </div>
</div>
