<div class="px-3 py-3">
    <!-- Header: Title on Left, Controls on Right -->
    <div class="journey-header">
        <div class="header-left">
            <h1 class="journey-title"><i class="bi bi-clock me-1"></i>Patient journey</h1>
            <div class="total-time">
                <span class="total-time-label">TOTAL TIME</span> <strong> 01:23 min</strong>
            </div>
        </div>
    </div>

    <div class="journey-content mt-2 bg-light">
        <div class="journey-steps-wrapper">
            <div class="journey-steps">
                <!-- Reception (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img src="assets/images/patient-journey/reception.png" alt="Reception Icon" class="step-icon"
                            style="height:35px" />
                    </div>
                    <div class="step-time">12 min</div>
                </div>

                <!-- Waiting (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img src="assets/images/patient-journey/waiting.png" alt="Waiting Icon" class="step-icon"
                            style="height:35px" />
                    </div>
                    <div class="step-time">32 min</div>
                </div>

                <!-- AR / NCT (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img src="assets/images/patient-journey/ar_nct.png" alt="AR / NCT Icon" class="step-icon"
                            style="height:35px" />
                    </div>
                    <div class="step-time">10 min</div>
                </div>

                <!-- Optom (Completed) -->
                <div class="step-item completed-step">
                    <div class="step-icon-wrapper completed">
                        <img src="assets/images/patient-journey/optom.png" alt="Optom Icon" class="step-icon"
                            style="height:35px" />
                    </div>
                    <div class="step-time">25 min</div>
                </div>

                <!-- Dilatation (Incomplete) -->
                <div class="step-item">
                    <div class="step-icon-wrapper completed">
                        <img src="assets/images/patient-journey/dilation.png" alt="Dilation Icon" class="step-icon"
                            style="height:35px" />
                        <!-- Status Indicator - Incomplete/Dash -->
                        <div class="step-status-indicator incomplete">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 13H5v-2h14v2z" fill="white" />
                            </svg>
                        </div>
                    </div>
                    <div class="step-time">08 min</div>
                </div>

                <!-- Ophthal -->
                <div class="step-item">
                    <div class="step-icon-wrapper current ophthal-icon-wrapper">
                        <img src="assets/images/patient-journey/ophthal.png" alt="Ophthal Icon" class="step-icon"
                            style="height:28px" />
                        <!-- Status Indicator - Engage/Pulsing -->
                        <div class="step-status-indicator engage">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="4" fill="white" />
                            </svg>
                        </div>
                    </div>
                    <div class="step-time">03 min</div>
                </div>
            </div>
        </div>
    </div>
</div>
