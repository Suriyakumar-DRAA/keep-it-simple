<div class="d-flex flex-column overflow-hidden">
    <app-stats-card> </app-stats-card>
</div>
<div class="d-flex flex-grow-1 overflow-hidden right-panel m-2 bg-white">
    <!-- Queue -->
    <app-patient-queue [patients]="patients" [selectedPatientId]="selectedPatientId"
        (selectPatient)="onSelectPatient($event)" [queueLabel]="selectedQueue" *ngIf="!isSidebarOpen">
    </app-patient-queue>

    <div class="flex-grow-1 d-flex flex-column overflow-hidden bg-white h-100">
        <ng-container *ngIf="patient;">
            <app-patient-info [patient]="patient" [case]="patient.case" class="flex-shrink-0">
                <!-- Prevent shrinking -->
            </app-patient-info>
        </ng-container>

        <div class="d-flex" *ngIf="showVerticalJourney()">
            <app-patient-journey-horizontal> </app-patient-journey-horizontal>
        </div>

        <div class="d-flex" *ngIf="showHorizontalJourney()">
            <app-patient-journey-vertical> </app-patient-journey-vertical>
        </div>

        <app-split-window> </app-split-window>
    </div>
</div>
